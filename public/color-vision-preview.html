<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>色覚練習・開発プレビュー｜ピタッとけんしん</title><link rel="stylesheet" href="./color-vision/preview.css"><script type="module" src="./color-vision/preview.js"></script></head><body><main>
<header><p class="eyebrow">ピタッとけんしん / 開発用</p><h1>色の丸の図柄プレビュー</h1><p>数字3種・ランドルト環3種の生成と密度を確認する試作画面です。</p></header>
<aside><strong>練習用の仮色・検査用ではない</strong><p>配色は未検証です。正規検査表の色再現を保証せず、診断・色覚評価には使用できません。</p></aside>
<form id="controls"><label>乱数seed<input id="seed" value="20261028" maxlength="100" required></label><label>充填率の目標<select id="density"><option value="0.65">65%</option><option value="0.70" selected>70%（暫定）</option><option value="0.75">75%</option></select></label><button type="submit">同じseedで描画</button><button id="regenerate" type="button">seedを変えて再生成</button><label class="gray"><input id="gray" type="checkbox">グレースケールで点検</label></form>
<p id="status" role="status" aria-live="polite"></p><section id="plates" aria-label="6図柄の比較"></section><footer>充填率＝丸の面積合計 ÷ 円形領域の面積。参考画像の「色付き画素比」とは異なる指標です。<br>65%・70%・75%を同じseedで切り替えて比較できます。丸数より重なりのない配置を優先します。</footer></main></body></html>
